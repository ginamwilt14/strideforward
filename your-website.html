<style>
/* Layout: one section per screen, like walking room to room; each room has its own color from a soft "paint chip" set, anchored by StrideForward teal and cream. */
:root{
  --bg:#F7F2EA; --surface:#FFFDF9; --ink:#2C2416; --muted:#635E54; --line:#DDD5C8;
  --teal:#1D6A72; --teal-dark:#155258; --on-teal:#FFFDF9; --gold:#C9A84C;
  --rose:#D9577A; --rose-ink:#A3365A; --rose-tint:#FBE7ED;
  --sun:#E3A21A; --sun-ink:#8A5D00; --sun-tint:#FDF1D6;
  --river:#1D7C86; --river-ink:#155258; --river-tint:#E2F2F3;
  --onion:#5E9E4A; --onion-ink:#3B6E2C; --onion-tint:#E8F3E1;
  --chive:#8A6BBE; --chive-ink:#5E4391; --chive-tint:#EFE9F8;
  --sky:#3E73A8; --sky-ink:#2A5580; --sky-tint:#E4EDF7;
  --berry:#C8433A; --berry-ink:#952D26; --berry-tint:#FBE5E2;
  --peach:#E08A57; --peach-ink:#9A5228; --peach-tint:#FCEBDF;
  --display:"Fraunces",Georgia,serif; --body:"DM Sans",Arial,sans-serif; --hand:"Kalam","Comic Sans MS",cursive;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17141B; --surface:#211D26; --ink:#F5F0E8; --muted:#BDB5A8; --line:#3A3440;
  --teal:#7CC3C9; --teal-dark:#A6D8DC; --on-teal:#10292C; --gold:#D9BC66;
  --rose:#F08FAA; --rose-ink:#F6B3C5; --rose-tint:#3A2430;
  --sun:#F2C35A; --sun-ink:#F6D58A; --sun-tint:#3A3020;
  --river:#6CC4CC; --river-ink:#9AD9DE; --river-tint:#1E3436;
  --onion:#9CD07F; --onion-ink:#B9E0A3; --onion-tint:#26331F;
  --chive:#B9A0E6; --chive-ink:#D0BEF0; --chive-tint:#2E2640;
  --sky:#86B3E2; --sky-ink:#AFCDEE; --sky-tint:#1F2B3A;
  --berry:#F08C83; --berry-ink:#F5B0A9; --berry-tint:#3A2222;
  --peach:#F2AE84; --peach-ink:#F6C7A9; --peach-tint:#3A2A20;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#17141B; --surface:#211D26; --ink:#F5F0E8; --muted:#BDB5A8; --line:#3A3440;
  --teal:#7CC3C9; --teal-dark:#A6D8DC; --on-teal:#10292C; --gold:#D9BC66;
  --rose:#F08FAA; --rose-ink:#F6B3C5; --rose-tint:#3A2430;
  --sun:#F2C35A; --sun-ink:#F6D58A; --sun-tint:#3A3020;
  --river:#6CC4CC; --river-ink:#9AD9DE; --river-tint:#1E3436;
  --onion:#9CD07F; --onion-ink:#B9E0A3; --onion-tint:#26331F;
  --chive:#B9A0E6; --chive-ink:#D0BEF0; --chive-tint:#2E2640;
  --sky:#86B3E2; --sky-ink:#AFCDEE; --sky-tint:#1F2B3A;
  --berry:#F08C83; --berry-ink:#F5B0A9; --berry-tint:#3A2222;
  --peach:#F2AE84; --peach-ink:#F6C7A9; --peach-tint:#3A2A20;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c, var(--teal));outline-offset:2px}

.preview{font-size:13px;color:var(--muted);text-align:center;padding:10px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;font-size:20px;color:var(--teal);letter-spacing:.005em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.brand small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.saved{font-size:13px;color:var(--muted)}

/* progress path: steps that climb, each painted its room color */
.path{display:flex;align-items:flex-end;gap:5px;margin:10px 0 4px;height:46px}
.path button{flex:1;border:0;padding:0;cursor:pointer;background:transparent;display:flex;align-items:flex-end;height:100%}
.path span{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--line);transition:background .25s, transform .2s}
.path button[data-state="done"] span{background:var(--c)}
.path button[data-state="here"] span{background:var(--c);box-shadow:inset 0 0 0 2px var(--surface), 0 0 0 2px var(--c)}
.path button:hover span{transform:translateY(-2px)}
.where{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.cheer{font-family:var(--hand);font-size:22px;line-height:1.3;color:var(--cink);margin:22px 0 0;transform:rotate(-1.2deg);transform-origin:left}
.room{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:26px 24px 28px}
.chip-label{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cink)}
.chip-label i{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--c)}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.08;text-wrap:balance;margin:.25em 0 .3em}
h1{font-size:clamp(40px,7vw,64px);color:var(--ink)}
h2{font-size:clamp(28px,4.4vw,40px)}
.lede{font-size:19px;color:var(--ink);max-width:60ch;margin:0}
.intro{color:var(--muted);margin:0 0 6px;max-width:62ch}

.q{padding:22px 0 4px;border-top:1px dashed var(--line);margin-top:20px}
.q:first-of-type{border-top:0;margin-top:6px}
.q > label, .q > .qlabel{display:block;font-weight:600;font-size:18px;line-height:1.4;margin-bottom:4px}
.hint{font-size:14.5px;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px 7px 14px;cursor:pointer;font-size:15.5px;line-height:1.3;display:inline-flex;align-items:center;gap:7px;transition:transform .12s, background .2s, border-color .2s}
.chip:hover{border-color:var(--c)}
.chip[aria-pressed="true"]{background:var(--ctint);border-color:var(--c);color:var(--ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip.unsure{border-style:dashed;color:var(--muted)}
.chip.unsure[aria-pressed="true"]{color:var(--ink)}
.pop{animation:pop .22s ease}
@keyframes pop{50%{transform:scale(1.06)}}
.limit{font-family:var(--hand);color:var(--cink);font-size:16px;min-height:1.4em;margin-top:6px}

input[type=text],input[type=url],input[type=email],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:8px}
input:focus,textarea:focus{border-color:var(--c, var(--teal));outline:none;box-shadow:0 0 0 3px var(--ctint, var(--river-tint))}
textarea{min-height:92px;resize:vertical}
.notebtn{background:none;border:0;padding:6px 0 0;color:var(--cink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* styles, fonts */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tile{border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile:hover{border-color:var(--c)}
.tile[aria-pressed="true"]{border-color:var(--c);background:var(--ctint);box-shadow:0 0 0 2px var(--c)}
.strip{display:flex;height:34px;border-radius:4px;overflow:hidden}
.strip b{flex:1}
.tile .name{font-size:14.5px;font-weight:600}
.tile .sample{font-size:22px;line-height:1.2;overflow-wrap:anywhere}

/* colors */
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:flex-start}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px}
.sw input[type=color]{width:64px;height:64px;border:1.5px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);cursor:pointer}
.sw code{font-size:12px;color:var(--muted)}
.sw button,.mini{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.sw button.addbtn{text-decoration:none;border:1.5px dashed var(--c);background:transparent;color:var(--cink);border-radius:10px;width:64px;height:64px;cursor:pointer;font-size:26px;line-height:1}

/* links */
.linkrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
.linkrow input{margin-top:0}
@media (max-width:560px){ .linkrow{grid-template-columns:1fr} }
.ghost{border:1.5px dashed var(--c);background:transparent;color:var(--cink);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px;margin-top:10px}

/* upload */
.drop{margin-top:12px;border:2px dashed var(--c);border-radius:12px;background:var(--ctint);padding:22px;text-align:center;cursor:pointer;transition:transform .15s}
.drop.over{transform:scale(1.01)}
.drop strong{display:block;font-size:17px}
.drop span{font-size:14px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:1;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .doc{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;padding:6px;text-align:center;overflow-wrap:anywhere;color:var(--muted)}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px;line-height:26px;padding:0}
.meter{font-size:13.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

/* socials */
.soc{display:grid;gap:10px;margin-top:12px}
.socd{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);padding:12px 14px;background:var(--bg)}
.socd h4{margin:0;font-size:16px}
.socd .sub{font-size:14px;color:var(--muted);margin-top:8px}
.socd .chips{margin-top:6px}

/* scale */
.scale{margin-top:14px}
.scale input{width:100%;accent-color:var(--c)}
.scale .ends{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.scale output{display:block;font-family:var(--hand);font-size:22px;color:var(--cink);margin-top:2px}

/* approach info */
.how{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:560px){ .how{grid-template-columns:1fr} }
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--bg)}
.card h4{margin:0 0 4px;font-family:var(--display);font-size:20px;font-weight:600}
.card p{margin:0;font-size:15.5px;color:var(--muted)}
.steps3{margin:12px 0 0;padding-left:22px}
.steps3 li{margin:4px 0}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.btn{background:var(--teal);color:var(--on-teal);border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{background:var(--teal-dark)}
.btn.back{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px}

/* welcome */
.welcome .room{border-top-width:8px}
.promises{list-style:none;padding:0;margin:18px 0 4px;display:grid;gap:10px}
.promises li{display:flex;gap:10px;align-items:flex-start}
.promises i{flex:none;width:12px;height:12px;border-radius:3px;margin-top:8px}
.paint{display:flex;gap:6px;margin:6px 0 12px}
.paint b{width:28px;height:10px;border-radius:2px}

/* review */
.rev h3{font-family:var(--display);font-size:22px;margin:22px 0 6px;display:flex;align-items:center;gap:10px}
.rev h3 i{width:14px;height:14px;border-radius:3px;display:inline-block}
.rev dl{margin:0;display:grid;gap:8px}
.rev dt{font-size:14px;color:var(--muted)}
.rev dd{margin:0 0 6px}
.rev .edit{font-size:14px}
.left{font-family:var(--hand);font-size:20px;color:var(--teal)}
.copied{font-size:14px;color:var(--muted);margin-left:8px}
.sendmsg{font-size:15px;color:var(--berry-ink);margin:10px 0 0;min-height:1.2em}
.btn:disabled{opacity:.6;cursor:default}
.thanks h1{margin-top:.1em}
.next{padding-left:22px}

/* ideas and tips that appear as you answer */
.badge{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.badge::before{content:"";width:12px;height:12px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ideas{display:grid;gap:8px;margin-top:10px}
.idea{border-left:4px solid var(--c);background:var(--ctint);border-radius:0 8px 8px 0;padding:10px 14px;font-size:15.5px;line-height:1.5}
.idea.new{animation:rise .35s ease}
.idea b{font-family:var(--hand);font-weight:700;color:var(--cink);margin-right:8px;font-size:17px}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.board .idea{border-radius:8px;border-left-width:6px;min-width:0}
details.deep{margin-top:24px;border:1.5px dashed var(--line);border-radius:var(--r);padding:2px 16px 14px;background:var(--bg)}
details.deep > summary{cursor:pointer;font-weight:600;color:var(--cink);padding:12px 0}
details.deep .q:first-of-type{border-top:0}
.mins{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px}

/* sneak peek: a tiny home page drawn from their answers */
.peek-label{font-family:var(--hand);font-size:19px;color:var(--cink);margin:18px 0 0}
.peek{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);max-width:100%}
.peek .bar{display:flex;gap:5px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line);align-items:center;min-width:0}
.peek .bar i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.peek .bar span{font-size:12px;color:var(--muted);margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek .hero{padding:26px 22px 22px}
.peek .t{font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0 0 8px;overflow-wrap:anywhere}
.peek .s{margin:0 0 16px;font-size:15px;max-width:46ch}
.peek .cta{display:inline-block;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px}
.peek .dots{display:flex;gap:6px;margin-top:18px}
.peek .dots b{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.peek .note{font-size:13px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}

.react{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.react button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:13.5px;cursor:pointer}
.react button:hover{border-color:var(--c)}
.react button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:600}
.idea.nah .txt{opacity:.55}
.speakrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.speak{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.speak .dot{width:9px;height:9px;border-radius:50%;background:var(--c, var(--teal))}
.speak.on{border-color:var(--c, var(--teal));font-weight:600}
.speak.on .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.speakmsg{font-size:13.5px;color:var(--muted)}
.ways{display:grid;gap:16px;margin-top:14px;padding:14px 16px;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg)}
.ways .lbl{font-weight:600;font-size:15px}
.ways .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ways .row input{flex:1 1 180px;margin-top:0;min-width:0}
.ways > div > input{margin-top:6px}
.small-btn{border:1.5px solid var(--c, var(--teal));background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:600;font-size:14.5px}
.photo-pick canvas{display:block;max-width:100%;width:380px;height:auto;border-radius:8px;cursor:crosshair;margin-top:10px}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pal button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:13px;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.pal button i{width:22px;height:22px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.notearea{min-height:58px}
.ideaslist{display:grid;gap:10px;margin-top:8px}
.ideaslist .item{display:flex;gap:10px;align-items:flex-start}
.ideaslist .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ctint);color:var(--cink);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:16px}
.ideaslist .grow{flex:1;min-width:0}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}

async function submitAll(email){ const fd = new FormData(); fd.append('form-name', 'website-questionnaire'); fd.append('bot-field', ''); fd.append('name', nm()); fd.append('email', email); fd.append('answers', plainText()); fd.append('ideas', ideasText()); fd.append('sneak_peek', peekText()); SECTIONS.forEach((s, i) => fd.append(`room_${String(i + 1).padStart(2, '0')}_${s.id}`, sectionText(s))); uploads.slice(0, 12).forEach((f, i) => { if(f.url) fd.append(`file_${i + 1}`, dataUrlToBlob(f.url, f.type), f.name); }); const res = await fetch('/', {method:'POST', body: fd}); if(!res.ok) throw new Error('send failed ' + res.status); }
function renderReview(main){ const sec = el('section', {class:'rev'}); setColor(sec, 'river'); const c = counts(); const room = el('div', {class:'room'}); room.append(el('span', {class:'chip-label'}, el('i'), 'Last look'), el('h2', null, 'Here is everything you shared'), el('p', {class:'left'}, c.total - c.done ? 'Anything you skipped, we can talk through over coffee. Perfect.' : 'You answered every single question. Wow.')); room.append(peekSlot('Your sneak peek')); const ideas = allIdeas(); if(ideas.length){ room.append(el('h3', null, el('i', {style:'background:var(--gold)', 'aria-hidden':'true'}), `Ideas already brewing for you (${ideas.length})`)); const board = el('div', {class:'board'}); const rank = x => ({love:0, like:1, '':2, nah:3})[(state.r || {})[x.key] || '']; ideas.slice().sort((a, b) => rank(a) - rank(b)).forEach(x => { const card = ideaCard(x, false); setColor(card, x.color); board.append(card); }); room.append(el('p', {class:'hint'}, 'Your favorites float to the top. Tap Love it, Like it, or Nah on any of them.'), board); } SECTIONS.forEach((s, i) => { const got = s.qs.map(q => [q, summary(q)]).filter(([, p]) => p.length); const h = el('h3', null, el('i', {style:`background:var(--${s.color})`, 'aria-hidden':'true'}), s.title); const edit = el('button', {type:'button', class:'mini edit'}, 'Edit'); edit.addEventListener('click', () => go(i)); h.append(edit); room.append(h); if(!got.length){ room.append(el('p', {class:'hint'}, "Skipped for now. We'll talk about it.")); return; } const dl = el('dl'); got.forEach(([q, p]) => { dl.append(el('dt', null, q.label), el('dd', null, p.join(' · '))); }); room.append(dl); }); if(uploads.length){ const t = el('div', {class:'thumbs'}); uploads.forEach(f => { const d = el('div', {class:'thumb'}); if(f.url && f.type.startsWith('image/')) d.append(el('img', {src:f.url, alt:f.name})); else d.append(el('div', {class:'doc'}, f.name)); t.append(d); }); room.append(t); } const copyNote = el('span', {class:'copied', 'aria-live':'polite'}); const copy = el('button', {type:'button', class:'btn back'}, 'Copy my answers'); copy.addEventListener('click', () => { const text = plainText(); const done = () => { copyNote.textContent = 'Copied.'; }; try{ navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, copyNote)); }catch(e){ fallbackCopy(text, copyNote); } }); const nameIn = el('input', {type:'text', id:'contact_name', autocomplete:'name'}); nameIn.value = state.name || ''; nameIn.addEventListener('input', () => { state.name = nameIn.value; save(); }); const emailIn = el('input', {type:'email', id:'contact_email', autocomplete:'email', placeholder:'you@example.com'}); emailIn.value = state.email || ''; emailIn.addEventListener('input', () => { state.email = emailIn.value; save(); }); const contact = el('div', {class:'q'}, el('label', {for:'contact_name'}, 'Your name'), nameIn, el('label', {for:'contact_email', style:'display:block;margin-top:14px'}, 'Where should I send my reply?'), emailIn, el('p', {class:'hint', style:'margin-top:10px'}, 'Your answers and files go to Gina at StrideForward and nowhere else. ', el('a', {href:'/privacy'}, 'Privacy details'))); const status = el('p', {class:'sendmsg', role:'status', 'aria-live':'polite'}); const send = el('button', {type:'button', class:'btn'}, state.sent ? 'Sent' : 'Send it to Gina'); if(state.sent) send.disabled = true; send.addEventListener('click', async () => { if(!IS_LIVE){ go('thanks'); return; } const email = (state.email || '').trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ status.textContent = 'Add your email so I can reply.'; emailIn.focus(); return; } const total = uploads.reduce((t, f) => t + f.size, 0); if(total > SEND_LIMIT){ status.textContent = 'Your files are a little too big to send together. Remove one or two in Room 7, then try again.'; return; } send.disabled = true; send.textContent = 'Sending...'; status.textContent = ''; try{ await submitAll(email); state.sent = true; try{ localStorage.removeItem(KEY); }catch(e){} if(window.gtag) window.gtag('event', 'sf_form_submit', {form_name:'website-questionnaire'}); go('thanks'); }catch(e){ send.disabled = false; send.textContent = 'Send it to Gina'; status.textContent = "That didn't go through. Your answers are still saved here, so try again in a minute, or tap Copy my answers and email them to hello@strideforward.world."; } }); room.append(contact, el('div', {class:'nav'}, el('span', null, copy, copyNote), send), status); sec.append(room); main.append(sec); }
function fallbackCopy(text, note){ const ta = el('textarea', {'aria-label':'Your answers'}); ta.value = text; ta.style.minHeight = '160px'; note.replaceWith(ta); ta.focus(); ta.select(); }

function renderThanks(main){ const sec = el('section', {class:'thanks'}); setColor(sec, 'sun'); const room = el('div', {class:'room'}); const paint = el('div', {class:'paint', 'aria-hidden':'true'}); ['rose','sun','river','onion','chive','sky','berry','peach'].forEach(n => paint.append(el('b', {style:`background:var(--${n})`}))); room.append(paint, el('span', {class:'chip-label'}, el('i'), 'Sent'), el('h1', null, nm() ? `Thank you, ${nm()}` : 'Thank you'), el('p', {class:'lede'}, allIdeas().length ? `I'll read every word before we meet, and I'll bring your favorite ideas to our coffee. I can't wait to see what we build together.` : "I'll read every word before we meet. I can't wait to see what we build together."), el('ol', {class:'next'}, el('li', null, 'We meet, talk through your answers, and look at the sites you love.'), el('li', null, 'Within two business days, you get a one-page scope note: the pages, who does what, and the timeline.'), el('li', null, 'Nothing gets built until you say yes.')), ...(IS_LIVE ? [] : [el('p', {class:'hint'}, 'Preview only: nothing was sent. On the live page, this button sends your answers and files to Gina.')]), el('p', {class:'cheer', style:'--cink:var(--teal)'}, 'Gina')); const again = el('button', {type:'button', class:'btn back'}, 'Back to my answers'); again.addEventListener('click', () => go('review')); room.append(el('div', {class:'nav'}, again, el('span'))); sec.append(room); main.append(sec); }

function render(){ const main = document.getElementById('main'); main.innerHTML = ''; renderPath(); if(state.step === 'welcome') renderWelcome(main); else if(state.step === 'review') renderReview(main); else if(state.step === 'thanks') renderThanks(main); else if(typeof state.step === 'number' && SECTIONS[state.step]) renderSection(main, state.step); else { state.step = 'welcome'; renderWelcome(main); } afterChange(); }

function start(data){ const pn = document.getElementById('previewNote'); if(pn) pn.hidden = IS_LIVE; load(); if(data && data.state){ state = data.state; } if(data && data.uploads){ uploads = data.uploads; } render(); }
window.claude?.hot?.snapshot?.(() => ({state, uploads}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
